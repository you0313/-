<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電卓</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#1c1c1e;color:#fff;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:340px}
  #disp{background:#000;border-radius:12px;padding:20px 14px;text-align:right;font-size:2rem;min-height:2.4rem;overflow-x:auto;margin-bottom:12px;word-break:break-all}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  button{font-size:1.4rem;padding:18px 0;border:0;border-radius:50px;background:#333;color:#fff;cursor:pointer}
  button.op{background:#ff9f0a}
  button.fn{background:#a5a5a5;color:#000}
  #viewer{display:none;width:100%;max-width:960px}
  #viewer input{padding:10px;width:60%;font-size:1rem}
  #viewer button{padding:10px 14px;font-size:1rem;border-radius:8px}
  #player{width:100%;aspect-ratio:16/9;border:0;margin:12px 0;background:#000}
  #results{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{cursor:pointer;font-size:.85rem}
  .card img{width:100%;border-radius:8px}
</style>
</head>
<body>

<!-- 電卓画面 -->
<div class="wrap" id="calc">
  <div id="disp">0</div>
  <div class="grid" id="keys"></div>
</div>

<!-- YouTube画面（最初は非表示） -->
<div id="viewer">
  <button id="back">← 電卓に戻る</button>
  <input id="q" placeholder="検索">
  <button id="go">検索</button>
  <button id="key">APIキー設定</button>
  <button id="prev" style="display:none">← 前の一覧</button>
  <iframe id="player" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
  <div id="results"></div>
</div>

<script>
// ===== 設定 =====
const SECRET = "1234";   // ←この数字を打って「=」を押すとYouTube画面が開く（好きな数字に変更）

// ===== 電卓 =====
let expr = "";
const disp = document.getElementById("disp");
const keys = ["C","(",")","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","⌫","="];

keys.forEach(k => {
  const b = document.createElement("button");
  b.textContent = k;
  if ("/*-+=".includes(k)) b.className = "op";
  if (["C","(",")"].includes(k)) b.className = "fn";
  b.onclick = () => press(k);
  document.getElementById("keys").appendChild(b);
});

function press(k) {
  if (k === "C") expr = "";
  else if (k === "⌫") expr = expr.slice(0, -1);
  else if (k === "=") {
    if (expr === SECRET) { openViewer(); expr = ""; }   // 秘密の数字
    else expr = calc(expr);
  } else expr += k;
  disp.textContent = expr || "0";
}

function calc(s) {
  if (!/^[0-9+\-*/.() ]+$/.test(s)) return "";
  try { return String(Function('"use strict";return (' + s + ')')()); }
  catch { return "Error"; }
}

// ===== YouTube =====
const $ = id => document.getElementById(id);
let cur = [];      // いま表示している一覧
let hist = [];     // 前の一覧の履歴

function openViewer() {
  $("calc").style.display = "none";
  $("viewer").style.display = "block";
  document.title = "YouTube";
}
function closeViewer() {
  $("player").src = "";
  $("viewer").style.display = "none";
  $("calc").style.display = "block";
  document.title = "電卓";
}
$("back").onclick = closeViewer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeViewer(); });

function getKey(force) {
  let k = localStorage.getItem("yt_key");
  if (!k || force) {
    k = prompt("YouTube Data API v3 のキーを入力") || "";
    localStorage.setItem("yt_key", k.trim());
  }
  return k.trim();
}
$("key").onclick = () => getKey(true);

// API呼び出し（共通）
async function api(path, params) {
  const key = getKey(false);
  if (!key) throw new Error("APIキーがありません");
  const url = "https://www.googleapis.com/youtube/v3/" + path + "?" +
              new URLSearchParams({ ...params, key });
  const data = await (await fetch(url)).json();
  if (data.error) throw new Error(data.error.message);
  return data;
}

const thumbOf = sn => (sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default) || {}).url || "";

// 一覧を表示（push=trueなら今の一覧を履歴に残す）
function show(items, push) {
  if (push && cur.length) hist.push(cur);
  cur = items;
  $("prev").style.display = hist.length ? "inline-block" : "none";
  const box = $("results");
  box.innerHTML = "";
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "card";
    const img = document.createElement("img");
    img.src = it.thumb;
    const t = document.createElement("div");
    const label = { video: "", channel: "【チャンネル】", playlist: "【再生リスト】" }[it.kind];
    t.textContent = label + it.title;   // textContentでXSS対策
    d.append(img, t);
    d.onclick = () => pick(it);
    box.appendChild(d);
  });
}
$("prev").onclick = () => { if (hist.length) show(hist.pop(), false); };

// クリック時の動作
async function pick(it) {
  try {
    if (it.kind === "video") {
      $("player").src = "https://www.youtube-nocookie.com/embed/" + it.id + "?autoplay=1";
      window.scrollTo(0, 0);
    } else if (it.kind === "playlist") {
      show(await loadPlaylist(it.id), true);
    } else if (it.kind === "channel") {
      const c = await api("channels", { part: "contentDetails", id: it.id });
      const up = c.items[0].contentDetails.relatedPlaylists.uploads;   // 投稿動画の再生リスト
      show(await loadPlaylist(up), true);
    }
  } catch (e) { alert("エラー: " + e.message); }
}

// 再生リストの動画を取得（消えた動画・非公開動画は除外）
async function loadPlaylist(id) {
  const d = await api("playlistItems", { part: "snippet", playlistId: id, maxResults: 24 });
  return d.items
    .filter(x => x.snippet.resourceId && !/^(Private|Deleted) video$/.test(x.snippet.title))
    .map(x => ({ kind: "video", id: x.snippet.resourceId.videoId, title: x.snippet.title, thumb: thumbOf(x.snippet) }));
}

// 検索（動画・チャンネル・再生リスト）
async function search() {
  const q = $("q").value.trim();
  if (!q) return;
  try {
    const d = await api("search", { part: "snippet", type: "video,channel,playlist", maxResults: 15, q });
    hist = []; cur = [];
    show(d.items.map(x => ({
      kind: x.id.kind.split("#")[1],
      id: x.id.videoId || x.id.channelId || x.id.playlistId,
      title: x.snippet.title,
      thumb: thumbOf(x.snippet)
    })), false);
  } catch (e) { alert("APIエラー: " + e.message); }
}
$("go").onclick = search;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
